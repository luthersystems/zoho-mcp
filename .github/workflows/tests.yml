name: Tests

# Runs the unit tests (pytest over tests/) on every pull request, in the merge
# queue and on pushes to main. The suite broke unnoticed once already (mcp 2.x
# removed mcp.server.fastmcp and nothing ran the tests), so the gate job
# below is the check to require on main.

on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub-hosted runners, not the LUTHER_CI_RUNNER pool: this repo is public,
# so hosted minutes are free, and a public repo's fork PRs must not run on the
# org's self-hosted runners.
jobs:
  # Decides whether the tests must run (scripts/ci-changes.sh). The run
  # always starts, so the gate below always reports; a docs-only PR skips
  # the tests instead of the whole workflow.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # On a pull request this checks out the merge commit. Its first parent
      # is the base branch tip, so depth 2 is enough for the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the decision script and the gate's needs list
        run: ./scripts/ci-changes-test.sh
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ./scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            ./scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  pytest:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every Python the package declares (pyproject requires-python and
        # classifiers). mcp 1.x needs 3.10 or later.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Install the package the way users get it (pyproject dependencies),
      # plus the test extras, so a dependency range that breaks the import
      # fails here.
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest

  # The one required check of this workflow.
  ci-all:
    name: CI (all required checks)
    # always(), so the gate reports on every run. A cancelled or failed job
    # then fails the gate below. A gate that did not run, or was skipped,
    # could count as passing for the required check.
    if: always()
    needs: [changes, pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pass only if the changes job succeeded and every other job succeeded,
      # or was skipped because the changes job said the PR is docs-only
      # (code=false). Any other skip fails, so a job skipped by mistake
      # cannot pass the gate.
      - name: Fail unless every required job passed
        if: >-
          needs.changes.result != 'success'
          || contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "::error::A required CI job failed, was cancelled or was skipped."
          exit 1
      - name: Every required job passed or was skipped as docs-only
        run: echo "ok"
